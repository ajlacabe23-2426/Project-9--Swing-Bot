name: Verify offline synthetic research lab
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm run security:secrets
      - run: npm run security:baseline
      - name: Audit dependency advisories when a lockfile exists
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm audit --audit-level=high --package-lock-only
          else
            echo "No npm dependency lockfile present; repository baseline verifies that package.json has no dependencies."
          fi
      - run: npm run check
