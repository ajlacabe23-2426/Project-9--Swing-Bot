name: Verify offline synthetic research lab
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm run security:secrets
      - run: npm run security:baseline
      - name: Audit dependency advisories when a lockfile exists
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm audit --audit-level=high --package-lock-only
          else
            echo "No npm dependency lockfile present; repository baseline verifies that package.json has no dependencies."
          fi
      - run: npm run check
      - name: Run StarNet Phase 3 CLI and verify private evidence output
        shell: bash
        run: |
          npm run starnet:phase3 -- --report-dir "$RUNNER_TEMP/project9-phase3-starnet"
          node --input-type=module -e '
            import {readdir,readFile} from "node:fs/promises";
            import {join} from "node:path";
            const d=process.env.RUNNER_TEMP+"/project9-phase3-starnet";
            const names=await readdir(d);
            if(names.length!==2||names.filter(x=>x.endsWith(".json")).length!==1||names.filter(x=>x.endsWith(".md")).length!==1)throw Error("Expected one JSON and one Markdown packet");
            const result=JSON.parse(await readFile(join(d,names.find(x=>x.endsWith(".json"))),"utf8"));
            if(result.softwareGate!=="PASS"||result.productionGate!=="NO_GO"||result.sideEffects.realOrdersCreated!==0||result.sideEffects.scheduledTasksCreated!==0)throw Error("StarNet Phase 3 packet failed closed");
          '
      - name: Verify cold-process SIGKILL and interrupted atomic-save recovery
        shell: bash
        run: |
          npm run accept:cold-recovery
      - name: Verify frozen chronological research and cost stress on engineered demo
        shell: bash
        run: |
          node scripts/research-time-split.mjs --demo > "$RUNNER_TEMP/project9-chronological.json"
          node --input-type=module -e '
            import {readFile} from "node:fs/promises";
            const report=JSON.parse(await readFile(process.env.RUNNER_TEMP+"/project9-chronological.json","utf8"));
            const expected=["DEVELOPMENT_REFERENCE","CHRONOLOGICAL_VALIDATION","CHRONOLOGICAL_HOLDOUT"];
            if(report.schema!=="project9-chronological-cost-stress-audit-v1"||
               report.study!=="DESCRIPTIVE_RESEARCH_ONLY_NO_TUNING"||
               report.phases.length!==3||
               report.phases.some((p,i)=>p.phase!==expected[i]||p.strategy.costSensitivity.length!==4)||
               report.safety.productionGate!=="NO_GO"||
               report.safety.realOrdersCreated!==0||
               report.inputIdentity.sourceKind!=="ENGINEERED_FICTIONAL_FIXTURE")throw Error("Chronological demo audit did not preserve the gates");
          '
      - name: Verify StarNet offline rail taxonomy and no-dispatch gates
        shell: bash
        run: |
          node scripts/review-market-rails.mjs --demo > "$RUNNER_TEMP/project9-rails.json"
          node --input-type=module -e '
            import {readFile} from "node:fs/promises";
            const r=JSON.parse(await readFile(process.env.RUNNER_TEMP+"/project9-rails.json","utf8"));
            if(r.schema!=="project9-starnet-rail-demo-v1"||
               r.scope!=="ENGINEERED_FICTIONAL_RESEARCH_ONLY"||
               r.productionGate!=="NO_GO"||
               r.instruments.length!==2||
               r.instruments[0].rail!=="LISTED_EQUITY"||
               r.instruments[1].rail!=="TOKENIZED_SECURITY"||
               r.instruments.some(x=>x.controls.realOrdersCreated!==0||
                 x.controls.chainTransactionsBroadcast!==0||
                 x.controls.productionGate!=="NO_GO"||
                 x.controls.assetExecutionSupported!==false)||
               r.comparison.automaticConversionPermitted!==false||
               r.comparison.liveDispatchAllowed!==false)
              throw Error("Offline multi-rail gates failed");
          '
          if node scripts/review-market-rails.mjs --live > /dev/null 2>&1; then
            echo "Unexpected live command acceptance"; exit 1
          fi
      - name: Verify StarNet fictional execution state machine and no live routing
        shell: bash
        run: |
          node scripts/review-simulated-execution.mjs --demo > "$RUNNER_TEMP/project9-fictional-execution.json"
          node --input-type=module -e '
            import {readFile} from "node:fs/promises";
            const packet=JSON.parse(await readFile(process.env.RUNNER_TEMP+"/project9-fictional-execution.json","utf8"));
            if(packet.schema!=="project9-starnet-fictional-execution-demo-v1" ||
               packet.scope!=="ENGINEERED_FICTIONAL_OFFLINE" ||
               packet.productionGate!=="NO_GO" ||
               packet.stock.rail!=="LISTED_EQUITY" ||
               packet.token.rail!=="TOKENIZED_SECURITY" ||
               packet.stock.status!=="SIMULATED_RECONCILED" ||
               packet.token.status!=="SIMULATED_CANCELLED" ||
               [packet.stock,packet.token].some(record=>
                 record.safety.productionGate!=="NO_GO" ||
                 record.safety.externalCalls!==0 ||
                 record.safety.realOrdersCreated!==0 ||
                 record.safety.chainTransactionsBroadcast!==0))
              throw Error("Fictional order lifecycle did not preserve NO_GO");
          '
          if node scripts/review-simulated-execution.mjs --live > /dev/null 2>&1; then
            echo "Unexpected live execution flag acceptance"; exit 1
          fi
      - name: Verify durable fictional execution journal on disposable local fixtures
        shell: bash
        run: |
          node scripts/accept-fictional-execution-journal.mjs --demo > "$RUNNER_TEMP/project9-execution-journal.json"
          node --input-type=module -e '
            import {readFile} from "node:fs/promises";
            const report=JSON.parse(await readFile(process.env.RUNNER_TEMP+"/project9-execution-journal.json","utf8"));
            if(report.schema!=="project9-fictional-execution-acceptance-v1" ||
               report.scope!=="ENGINEERED_FICTIONAL_OFFLINE" ||
               report.softwareGate!=="PASS" ||
               report.productionGate!=="NO_GO" ||
               report.recoveredRevision!==8 ||
               report.checks.sameProcessCloseReopen!==true ||
               Object.hasOwn(report.checks,"crossProcessReopen") ||
               report.checks.retryIdentitiesPreserved!==true ||
               report.checks.hashChainReplayed!==true ||
               report.checks.actualOrdersCreated!==0 ||
               report.checks.blockchainBroadcasts!==0 ||
               report.checks.externalCalls!==0 ||
               report.resultingStates[0].status!=="SIMULATED_RECONCILED" ||
               report.resultingStates[1].status!=="SIMULATED_CANCELLED")
              throw Error("Durable fictional journal acceptance failed");
          '
          if node scripts/accept-fictional-execution-journal.mjs --live > /dev/null 2>&1; then
            echo "Unexpected acceptance of live execution"; exit 1
          fi
      - name: Verify fictional risk accounting, reservations and no broker activity
        shell: bash
        run: |
          node scripts/accept-fictional-risk-accounting.mjs --demo > "$RUNNER_TEMP/project9-fictional-risk.json"
          node --input-type=module -e '
            import {readFile} from "node:fs/promises";
            const p=JSON.parse(await readFile(process.env.RUNNER_TEMP+"/project9-fictional-risk.json","utf8"));
            const c=p.checks;
            if(p.schema!=="project9-fictional-risk-acceptance-v1" ||
              p.scope!=="ENGINEERED_FICTIONAL_OFFLINE" ||
              p.softwareGate!=="PASS" || p.productionGate!=="NO_GO" ||
              !c.cashReservation || !c.holdingsReservation ||
              !c.overspendDenied || !c.doubleSellDenied ||
              !c.partialFillAccounting || !c.cancellationRelease ||
              !c.independentlyRecomputedFictionalBalances ||
              !c.sameProcessReopen || !c.duplicateRetriesByteIdentical ||
              c.localMacOperatorAcceptance!=="NOT_RUN" ||
              c.externalCalls!==0 || c.realOrdersCreated!==0 ||
              c.blockchainBroadcasts!==0 || p.finalCashTicks!==10000 ||
              p.reconciliation?.finding!=="PASS_FICTIONAL_ARITHMETIC_ONLY" ||
              p.reconciliation?.checkedEvents!==5 ||
              p.reconciliation?.authenticExecutionsVerified!==false ||
              p.decisionCount!==4)
              throw Error("Fictional risk accounting acceptance failed");
          '
          if node scripts/accept-fictional-risk-accounting.mjs --live > /dev/null 2>&1; then
            echo "Fictional risk CLI wrongly accepted live mode"; exit 1
          fi
      - name: Verify fictional execution-message emulator and durable quarantine
        shell: bash
        run: |
          node scripts/accept-fictional-messages.mjs --demo > "$RUNNER_TEMP/project9-fictional-messages.json"
          node --input-type=module -e '
            import {readFile} from "node:fs/promises";
            const p=JSON.parse(await readFile(process.env.RUNNER_TEMP+"/project9-fictional-messages.json","utf8"));
            const c=p.checks;
            if(p.schema!=="project9-fictional-message-acceptance-v1"||
              p.scope!=="ENGINEERED_FICTIONAL_OFFLINE"||
              p.softwareGate!=="PASS"||p.productionGate!=="NO_GO"||
              !c.futureMessageHeld||!c.staleMessageHeld||
              !c.impossibleRejectionHeld||!c.duplicateAcknowledgmentNoWrite||
              !c.sameProcessReopen||!c.messageIdentityPreserved||
              !c.riskAndPortAtomicReceipt||!c.independentFictionalArithmetic||
              c.realOrdersCreated!==0||c.chainTransactionsBroadcast!==0||
              c.externalCalls!==0||c.MacOperatorAcceptance!=="NOT_RUN"||
              p.recordedMessages!==8||p.appliedMessages!==5||
              p.quarantinedMessages!==3||p.resultingFictionalCashTicks!==8000||
              p.reconciliationFinding!=="PASS_FICTIONAL_ARITHMETIC_ONLY")
              throw Error("Fictional message emulator acceptance failed");
          '
          if node scripts/accept-fictional-messages.mjs --live > /dev/null 2>&1; then
            echo "Message emulator unexpectedly accepted live execution"; exit 1
          fi
      - name: Verify fictional quarantine review, cold recovery and emergency stop
        shell: bash
        run: |
          node scripts/accept-fictional-operator-controls.mjs --demo > "$RUNNER_TEMP/project9-operator-controls.json"
          node --input-type=module -e '
            import {readFile} from "node:fs/promises";
            const p=JSON.parse(await readFile(process.env.RUNNER_TEMP+"/project9-operator-controls.json","utf8"));
            const c=p.checks;
            if(p.schema!=="project9-fictional-operator-controls-acceptance-v1"||
              p.scope!=="ENGINEERED_FICTIONAL_OFFLINE"||
              p.softwareGate!=="PASS"||p.productionGate!=="NO_GO"||
              !c.explicitReviewRelease||!c.invalidReleaseRefused||
              !c.unsafeQuarantineDismissal||!c.irreversibleEmergencyStop||
              !c.sameProcessCloseReopen||!c.independentFictionalAccounting||
              !c.noAutomaticCancellation||c.realOrdersCreated!==0||
              c.chainTransactionsBroadcast!==0||c.externalCalls!==0||
              c.MacOperatorAcceptance!=="NOT_RUN"||
              p.reviews!==2||p.stopState!=="STOPPED_LATCHED"||
              p.fictionalCashTicks!==8000||p.fictionalReservedTicks!==3000||
              p.sourceAuthenticity!=="ENGINEERED_FIXTURE_ONLY")
              throw Error("Offline fictional operator control acceptance failed");
          '
          if node scripts/accept-fictional-operator-controls.mjs --live >/dev/null 2>&1; then
            echo "Operator controls accepted unsafe live flag"; exit 1
          fi
      - name: Verify multi-process fictional scenario endurance and SIGKILL recovery
        shell: bash
        run: |
          node scripts/accept-fictional-endurance.mjs --demo > "$RUNNER_TEMP/project9-endurance.json"
          node --input-type=module -e '
            import {readFile} from "node:fs/promises";
            const r=JSON.parse(await readFile(process.env.RUNNER_TEMP+"/project9-endurance.json","utf8"));
            const c=r.checks;
            if(r.schema!=="project9-fictional-endurance-acceptance-v1" ||
              r.scope!=="ENGINEERED_FICTIONAL_OFFLINE" ||
              r.softwareGate!=="PASS" || r.productionGate!=="NO_GO" ||
              !c.multiProcessScenarioReplays || !c.initialReadByteStable ||
              !c.simultaneousCashAndHoldingsReservations ||
              !c.quarantineAndExplicitRelease || !c.deterministicPartialFillsAndCancellations ||
              !c.SIGKILLIdleProcessCrash || !c.staleWriterLockNotAutoStolen ||
              !c.ownerReviewedDisposableLock || !c.unchangedStateAfterCrash ||
              !c.independentLedgerRecalculatedInEveryChild ||
              !c.immutableStopAcrossRestarts || !c.finalRepeatedReadsIdentical ||
              c.observedRealProviderExecutions!==false || c.macOperatorAcceptance!=="NOT_RUN" ||
              c.realOrdersCreated!==0 || c.blockchainBroadcasts!==0 ||
              c.externalCalls!==0 || r.recordedDecisions!==25 ||
              r.fictionalEvents!==48 || r.messageReceipts!==48 ||
              r.reviewDecisions!==1 || r.finalRevision!==76 ||
              r.simulatedCashTicks!==118000 || r.simulatedEquityUnits!==18 ||
              r.simulatedTokenUnits!==0 || r.stopState!=="STOPPED_LATCHED" ||
              r.childTermination!=="SIGKILL")
              throw Error("Fictional endurance evidence gate refused");
          '
          if node scripts/accept-fictional-endurance.mjs --live > /dev/null 2>&1; then
            echo "Endurance CLI accepted unsafe live flag"; exit 1
          fi
      - name: Verify independent three-level research evidence and NO_GO boundaries
        shell: bash
        run: |
          node scripts/starnet-three-level-evidence.mjs --demo > "$RUNNER_TEMP/project9-three-level-evidence.json"
          node scripts/starnet-three-level-evidence.mjs --demo --markdown > "$RUNNER_TEMP/project9-three-level-evidence.md"
          node --input-type=module -e '
            import {readFile} from "node:fs/promises";
            const r=JSON.parse(await readFile(process.env.RUNNER_TEMP+"/project9-three-level-evidence.json","utf8"));
            const md=await readFile(process.env.RUNNER_TEMP+"/project9-three-level-evidence.md","utf8");
            const e=r.levels?.engineering,p=r.levels?.research,o=r.levels?.operations;
            if(r.schema!=="project9-starnet-three-level-evidence-readiness-v1"||
              r.study!=="OFFLINE_RESEARCH_VALIDATION_ONLY"||
              r.overall?.productionGate!=="NO_GO"||
              r.overall?.levelsAreIndependent!==true||
              r.overall?.realOrdersCreated!==0||
              r.overall?.blockchainTransactionsBroadcast!==0||
              r.overall?.liveTradingEnabled!==false||
              r.overall?.autoPromotionAllowed!==false||
              e?.status!=="PASS_FICTIONAL_ARITHMETIC_ONLY"||
              e?.verification!=="RECOMPUTED_FROM_LOCAL_SYNTHETIC_JOURNAL"||
              e?.reviewedEvents!==3||e?.reconstructedCashTicks!==8000||
              e?.providerExecutionsAuthenticated!==false||
              p?.status!=="PARTIAL_DESCRIPTIVE_CHECKS_ONLY"||
              p?.sourceKind!=="ENGINEERED_OFFLINE_FIXTURE"||
              p?.historicalBars!==190||
              p?.chronology?.contiguousNoShuffle!==true||
              p?.chronology?.windowsContainedWithinOwnPartition!==true||
              p?.chronology?.hypotheticalCostsWorsenMean!==true||
              p?.historicalAuthenticityIndependentlyVerified!==false||
              p?.testedOutOfSampleEfficacy!==false||
              p?.pointInTimeUniverseIndependentlyVerified!==false||
              p?.userOrVendorLabelsCannotRaiseThisStatus!==true||
              o?.status!=="NOT_VERIFIED"||o?.localMacAcceptance!=="NOT_RUN"||
              !md.includes("Three-Level Evidence Readiness")||
              !md.includes("NO_GO")||!md.includes("authenticity"))
              throw Error("Independent evidence readiness report failed closed");
          '
          if node scripts/starnet-three-level-evidence.mjs --live > /dev/null 2>&1; then
            echo "Evidence report accepted live mode"; exit 1
          fi
      - name: Verify cross-source historical disagreement and no authenticity escalation
        shell: bash
        run: |
          node scripts/starnet-three-level-evidence.mjs --demo > "$RUNNER_TEMP/project9-cross-source.json"
          node scripts/starnet-three-level-evidence.mjs --demo --markdown > "$RUNNER_TEMP/project9-cross-source.md"
          node --input-type=module -e '
            import {readFile} from "node:fs/promises";
            const r=JSON.parse(await readFile(process.env.RUNNER_TEMP+"/project9-cross-source.json","utf8"));
            const md=await readFile(process.env.RUNNER_TEMP+"/project9-cross-source.md","utf8");
            const c=r.levels?.research?.crossSourceComparison;
            if(r.overall?.productionGate!=="NO_GO"||
              r.levels?.engineering?.status!=="PASS_FICTIONAL_ARITHMETIC_ONLY"||
              r.levels?.research?.status!=="PARTIAL_DESCRIPTIVE_CHECKS_ONLY"||
              r.levels?.operations?.status!=="NOT_VERIFIED"||
              c?.schema!=="project9-offline-cross-source-provenance-audit-v1"||
              c?.status!=="DISCREPANCIES_REQUIRE_MANUAL_REVIEW"||
              c?.scope!=="TWO_UNTRUSTED_LOCAL_HISTORICAL_FILES"||
              c?.overlap?.commonDates!==189||
              c?.overlap?.onlyPrimaryDates!==1||
              c?.overlap?.priceDiscrepancyDates!==1||
              c?.overlap?.volumeDiscrepancyDates!==0||
              c?.verification?.sourceIndependenceAuthenticated!==false||
              c?.verification?.historicalAuthenticityIndependentlyVerified!==false||
              c?.verification?.pointInTimeAvailabilityIndependentlyVerified!==false||
              c?.verification?.dataLicensingIndependentlyVerified!==false||
              c?.verification?.realOrdersCreated!==0||
              c?.verification?.blockchainTransactionsBroadcast!==0||
              c?.verification?.externalCalls!==0||
              c?.verification?.productionGate!=="NO_GO"||
              !md.includes("DISCREPANCIES_REQUIRE_MANUAL_REVIEW"))
              throw Error("Cross-source audit missing discrepancy or research-only evidence gates");
          '
          if node scripts/starnet-three-level-evidence.mjs --live >/dev/null 2>&1; then
            echo "Read-only provenance report accepted live execution flag"; exit 1
          fi
      - name: Verify fictional custody-reference consistency and no PIT authenticity promotion
        shell: bash
        run: |
          node scripts/starnet-three-level-evidence.mjs --demo > "$RUNNER_TEMP/project9-custody.json"
          node scripts/starnet-three-level-evidence.mjs --demo --markdown > "$RUNNER_TEMP/project9-custody.md"
          node --input-type=module -e '
            import {readFile} from "node:fs/promises";
            const r=JSON.parse(await readFile(process.env.RUNNER_TEMP+"/project9-custody.json","utf8"));
            const md=await readFile(process.env.RUNNER_TEMP+"/project9-custody.md","utf8");
            const c=r.levels?.research?.custodyEvidence;
            if(r.overall?.productionGate!=="NO_GO"||
               r.levels?.engineering?.status!=="PASS_FICTIONAL_ARITHMETIC_ONLY"||
               r.levels?.research?.status!=="PARTIAL_DESCRIPTIVE_CHECKS_ONLY"||
               r.levels?.operations?.status!=="NOT_VERIFIED"||
               c?.schema!=="project9-offline-custody-evidence-audit-v1"||
               c?.status!=="REVIEW_REQUIRED"||
               c?.dataset?.observedBars!==190||
               c?.references?.archiveSnapshotCount!==1||
               c?.references?.corporateActionStatus!=="NOT_ASSESSED"||
               c?.references?.rightsStatus!=="NOT_VERIFIED"||
               c?.verification?.exactLocalByteHashesMatch!==true||
               c?.verification?.declaredCaptureDateChronologicallyConsistent!==true||
               c?.verification?.independentSourceAuthenticityVerified!==false||
               c?.verification?.pointInTimeAvailabilityIndependentlyVerified!==false||
               c?.verification?.corporateActionTruthVerified!==false||
               c?.verification?.termsOfUseIndependentlyReviewed!==false||
               c?.verification?.signedArchiveEvidenceVerified!==false||
               c?.verification?.realOrdersCreated!==0||
               c?.verification?.blockchainTransactionsBroadcast!==0||
               c?.verification?.externalCalls!==0||
               c?.verification?.productionGate!=="NO_GO"||
               !md.includes("Custody-reference evidence: REVIEW_REQUIRED"))
              throw Error("Custody evidence gate did not retain structural-only provenance");
          '
          if node scripts/starnet-three-level-evidence.mjs --live > /dev/null 2>&1; then
            echo "Custody audit unexpectedly accepted live execution"; exit 1
          fi
      - name: Verify offline research-quality sample limits and descriptive holdout boundaries
        shell: bash
        run: |
          node scripts/starnet-three-level-evidence.mjs --demo > "$RUNNER_TEMP/project9-research-quality.json"
          node scripts/starnet-three-level-evidence.mjs --demo --markdown > "$RUNNER_TEMP/project9-research-quality.md"
          node --input-type=module -e '
            import {readFile} from "node:fs/promises";
            const r=JSON.parse(await readFile(process.env.RUNNER_TEMP+"/project9-research-quality.json","utf8"));
            const md=await readFile(process.env.RUNNER_TEMP+"/project9-research-quality.md","utf8");
            const q=r.levels?.research?.researchQuality;
            if(r.overall?.productionGate!=="NO_GO"||
              r.levels?.engineering?.status!=="PASS_FICTIONAL_ARITHMETIC_ONLY"||
              r.levels?.research?.status!=="PARTIAL_DESCRIPTIVE_CHECKS_ONLY"||
              r.levels?.operations?.status!=="NOT_VERIFIED"||
              q?.schema!=="project9-offline-research-quality-v1"||
              q?.status!=="DESCRIPTIVE_ONLY_INDEPENDENT_EVIDENCE_MISSING"||
              q?.partitions?.length!==3||
              q?.partitions?.[0]?.completedBars!==70||
              q?.partitions?.[1]?.completedBars!==35||
              q?.partitions?.[2]?.completedBars!==36||
              q?.partitions?.reduce((a,p)=>a+p.strategyWindows,0)!==r.levels?.research?.chronology?.strategyObservations||
              q?.partitions?.reduce((a,p)=>a+p.periodicControlWindows,0)!==r.levels?.research?.chronology?.periodicControlObservations||
              q?.partitions?.[2]?.sampleReferenceFloor!==20||
              q?.partitions?.[2]?.sampleReferenceFloorMet!==false||
              q?.frozenMethod?.holdoutIsOnlyADescriptivePartition!==true||
              q?.frozenMethod?.independentOutOfSampleEfficacyEstablished!==false||
              q?.costReview?.eachPhaseCostOrderingRechecked!==true||
              q?.verification?.chronologyAndWindowDateIndicesRecomputed!==true||
              q?.verification?.sourceIndependenceAuthenticated!==false||
              q?.verification?.strategyEfficacyEstablished!==false||
              q?.verification?.independentStatisticalConfidenceCalculated!==false||
              q?.verification?.realOrdersCreated!==0||
              q?.verification?.externalCalls!==0||
              q?.verification?.productionGate!=="NO_GO"||
              !q.reviewReasons.includes("INSUFFICIENT_HYPOTHETICAL_STRATEGY_WINDOWS_IN_ONE_OR_MORE_PARTITIONS")||
              !md.includes("Research-quality evidence: DESCRIPTIVE_ONLY_INDEPENDENT_EVIDENCE_MISSING"))
              throw Error("Research-quality report erroneously upgraded the descriptive fixture");
          '
          if node scripts/starnet-three-level-evidence.mjs --live >/dev/null 2>&1; then
            echo "Research quality accepted live execution"; exit 1
          fi
      - name: Check browser availability for loopback acceptance
        run: command -v google-chrome
      - name: Exercise workstation in headless Chromium
        env:
          RUN_BROWSER_ACCEPTANCE: '1'
          CHROME_BIN: /usr/bin/google-chrome
        run: node --test tests/browser-workstation.test.mjs
