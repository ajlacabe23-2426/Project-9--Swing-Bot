name: Fictional classroom replay macOS acceptance
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  classroom:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Check preinstalled browser
        run: test -x "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
      - name: Require complete classroom component and sandboxed browser evidence
        env:
          CHROME_BIN: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
        run: node scripts/accept-fictional-clock-local.mjs --browser
